<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex, nofollow">
<title>Naver → Google Calendar Bridge</title>
<style>
  :root{--bg:#fbfaf8;--fg:#1c1b19;--muted:#6b6862;--line:#e2ded7;--accent:#2f6f4e;}
  @media (prefers-color-scheme:dark){
    :root{--bg:#171614;--fg:#eceae6;--muted:#9c9890;--line:#33312d;--accent:#7fc4a0;}
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);
       font:15px/1.65 -apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans KR",sans-serif;}
  main{max-width:640px;margin:0 auto;padding:56px 24px 80px}
  h1{font-size:22px;margin:0 0 6px;letter-spacing:-.01em}
  p.sub{color:var(--muted);margin:0 0 32px;font-size:14px}
  .card{border:1px solid var(--line);border-radius:10px;padding:18px 20px;margin-bottom:20px}
  .label{font-size:12px;text-transform:uppercase;letter-spacing:.06em;color:var(--muted);margin-bottom:8px}
  code{font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:13px;
       background:rgba(127,127,127,.12);padding:2px 6px;border-radius:4px;word-break:break-all}
  #url{display:block;padding:10px 12px;margin-bottom:12px}
  button{font:inherit;font-size:13px;padding:7px 14px;border:1px solid var(--line);
         border-radius:6px;background:transparent;color:var(--fg);cursor:pointer}
  button:hover{border-color:var(--accent);color:var(--accent)}
  ol{padding-left:20px;margin:0}
  li{margin-bottom:8px}
  footer{color:var(--muted);font-size:12px;margin-top:36px;border-top:1px solid var(--line);padding-top:16px}
</style>
</head>
<body>
<main>
  <h1>Naver → Google Calendar Bridge</h1>
  <p class="sub">네이버 캘린더를 30분 주기로 내보내 구글 캘린더에서 구독합니다.</p>

  <div class="card">
    <div class="label">구독 URL</div>
    <code id="url">…</code>
    <button id="copy">URL 복사</button>
    <button id="dl">.ics 열기</button>
  </div>

  <div class="card">
    <div class="label">구글 캘린더에 추가하는 법</div>
    <ol>
      <li>구글 캘린더 → 왼쪽 <b>다른 캘린더 +</b> → <b>URL로 추가</b></li>
      <li>위 구독 URL 붙여넣기 → <b>캘린더 추가</b></li>
      <li>구글은 자체 주기(수 시간)로 재조회합니다. 즉시 반영이 필요하면 모드 B(서비스 계정 upsert)를 사용하세요.</li>
    </ol>
  </div>

  <footer>
    최종 갱신: <span id="mtime">확인 중…</span> ·
    자동 생성 파일이므로 직접 편집하지 마세요.
  </footer>
</main>
<script>
  const icsUrl = new URL('calendar.ics', location.href).href;
  document.getElementById('url').textContent = icsUrl;
  document.getElementById('copy').onclick = async () => {
    try { await navigator.clipboard.writeText(icsUrl);
          document.getElementById('copy').textContent = '복사됨'; }
    catch { document.getElementById('copy').textContent = '복사 실패'; }
  };
  document.getElementById('dl').onclick = () => location.href = icsUrl;
  fetch(icsUrl, {method:'HEAD'}).then(r => {
    const lm = r.headers.get('last-modified');
    document.getElementById('mtime').textContent =
      lm ? new Date(lm).toLocaleString('ko-KR') : '알 수 없음';
  }).catch(() => document.getElementById('mtime').textContent = '알 수 없음');
</script>
</body>
</html>
